name: qmatch
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  characters: ^1.3.0
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.2.10
  cloud_firestore: ^5.6.12
  google_sign_in: ^5.4.4
  sign_in_with_apple: ^7.0.1
  # Path-vendored 0.2.0 with AGP namespace patch (do not use pub-cache copy).
  flutter_windowmanager:
    path: packages/flutter_windowmanager_local
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  image_picker: ^1.0.7
  firebase_storage: ^12.4.10
  permission_handler: ^11.2.0
  font_awesome_flutter: ^10.7.0
  intl_phone_field: ^3.2.0
  shared_preferences: ^2.3.3
  in_app_purchase: ^3.3.0
  cloud_functions: ^5.6.2
  crypto: ^3.0.7
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/chat/
    - assets/data/iq_questions.json
    - assets/data/eq_questions.json
    - assets/data/persona_profiles_v1.json
    - assets/data/persona_profiles_v2_20d.json
    - assets/data/persona_shadow_scoring_config_v1.json
    - assets/data/assessment_sets/
    - assets/data/assessment_v3/iq/iq_bank_tr_v1.json
    - assets/data/assessment_v3/iq/iq_bank_en_v1.json
    - assets/data/assessment_v3/eq/eq_bank_tr_v1.json
    - assets/data/assessment_v3/eq/eq_bank_en_v1.json
    - assets/data/assessment_v3/frequency/frequency_bank_tr_v1.json
    - assets/data/assessment_v3/frequency/frequency_bank_en_v1.json
    - assets/images/chat_wallpaper_dark.png
    # Golden-test font stand-ins (Roboto renamed). Not intended app UI fonts.
    - test/fonts/google_fonts/
